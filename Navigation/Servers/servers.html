    <div class="sidebar-scroll">
      <div class="sidebar-label">Servers</div>

          <span class="toggle">▸</span> FiveM

          <button class="channel-item active" data-channel="fivem-servers"># fivem-servers</button>
          <button class="channel-item" data-channel="fivem-discord"># fivem-discord</button>
        </div>
      </div>

      <div class="channel-group">

        </div>

        </div>
      </div>
